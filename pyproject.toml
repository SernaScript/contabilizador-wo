[project]
name = "contabilizador"
version = "0.1.0"
description = "DIAN XML purchase invoices to World Office import workbook"
readme = "README.md"
authors = [
    { name = "Diego Serna", email = "juan.serna@wearedev.co" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "platformdirs>=4.12.2",
    "pyside6>=6.11.2",
    "sqlalchemy>=2",
]

[project.scripts]
contabilizador = "contabilizador.ui.app:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/contabilizador/shared/migrations/versions/*" = ["N999"]
# El paquete de textos re-exporta cada modulo de area con import *
"src/contabilizador/shared/strings/__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["contabilizador"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
qt_api = "pyside6"

[tool.coverage.run]
source = ["contabilizador"]
branch = true
