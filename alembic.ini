# Alembic CLI config (development). The app runs migrations programmatically via
# contabilizador.shared.migrations_runner.upgrade_to_head.
# Usage: uv run alembic -x db=path/to/file.db revision --autogenerate -m "message"
[alembic]
script_location = %(here)s/src/contabilizador/shared/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
